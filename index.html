<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nhật ký</title>
<style>
  :root { --bg:#faf8f4; --ink:#2a2a2e; --muted:#8a8782; --line:#e4e0d8; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin:0; color:var(--ink); font-family: Georgia, "Times New Roman", serif; line-height:1.75; }
  main { max-width: 680px; margin: 0 auto; padding: 56px 22px 96px; }
  h1 { font-weight: 400; font-size: 2rem; letter-spacing: .02em; margin: 0; }
  .sub { color: var(--muted); font-size: .95rem; margin: 4px 0 0; }
  .hello { color: var(--muted); font-size: .95rem; margin: 28px 0 0; font-style: italic; }
  .gate { max-width: 420px; margin: 12vh auto 0; }
  .gate p { color: var(--muted); margin: 0 0 22px; }
  label { display:block; font-size:.9rem; color: var(--muted); margin: 16px 0 4px; }
  input { width:100%; font: inherit; padding: 9px 2px; border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--ink); border-radius:0; }
  input:focus { outline:none; border-bottom-color: var(--ink); }
  button { margin-top: 28px; font: inherit; padding: 9px 22px; background: var(--ink); color: var(--bg); border: 0; cursor: pointer; }
  button:disabled { opacity:.5; cursor: default; }
  #msg { min-height: 1.6em; margin-top: 14px; font-size: .9rem; color: #9a4b4b; }
  .timeline { margin-top: 44px; border-left: 1px solid var(--line); padding-left: 0; }
  .entry { display: grid; grid-template-columns: 112px 1fr; gap: 0 18px; padding: 26px 0 30px 20px; position: relative; }
  .meta { text-align: center; }
  .face { width: 84px; height: auto; mix-blend-mode: multiply; display:block; margin: 0 auto 4px; }
  time { display:block; font-size: .95rem; color: var(--muted); letter-spacing: .06em; }
  .body p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .vid { margin-top: 18px; aspect-ratio: 16/9; background: #00000008; }
  .vid iframe { width:100%; height:100%; border:0; }
  .end { margin: 40px 0 0 0; color: var(--muted); font-style: italic; text-align:center; }
  @media (max-width: 520px) {
    .entry { grid-template-columns: 1fr; gap: 6px; }
    .meta { display:flex; align-items:center; gap:12px; text-align:left; }
    .face { width: 56px; margin: 0; }
  }
</style>
</head>
<body>
<main>
  <section class="gate" id="gate">
    <p>Trang này chỉ dành cho những người biết đường vào. Bạn trả lời giúp mình vài câu nhé.</p>
    <form id="form" autocomplete="off">
      <label for="who">Bạn là ai?</label>
      <input id="who" required>
      <label for="vy">Sinh nhật của Vỹ (ngày/tháng/năm)</label>
      <input id="vy" inputmode="numeric" placeholder="dd/mm/yyyy" required>
      <label for="nm">Họ tên đầy đủ của Trung</label>
      <input id="nm" required>
      <label for="tb">Sinh nhật của Trung (ngày/tháng/năm)</label>
      <input id="tb" inputmode="numeric" placeholder="dd/mm/yyyy" required>
      <button id="btn" type="submit">Vào</button>
      <div id="msg" role="status"></div>
    </form>
  </section>
  <div id="diary" hidden></div>
  <noscript>Trang này cần bật JavaScript để mở.</noscript>
</main>

<script>
// Dùng chung cho build (Node) và trang web (trình duyệt). Không có dữ liệu bí mật ở đây.
function normText(s) {
  return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/đ/g, 'd').replace(/[^a-z0-9]/g, '');
}
function normDate(s) {
  var p = String(s).match(/\d+/g);
  if (!p || p.length !== 3) return null;
  var d = p[0], m = p[1], y = p[2];
  if (d.length > 2 || m.length > 2 || y.length !== 4) return null;
  return d.padStart(2, '0') + '-' + m.padStart(2, '0') + '-' + y;
}
function secretOf(vyBirthday, trungName, trungBirthday) {
  var a = normDate(vyBirthday), c = normDate(trungBirthday), b = normText(trungName);
  if (!a || !b || !c) return null;
  return 'v1|' + a + '|' + b + '|' + c;
}
var KDF_ITER = 600000;
function toB64(u8) { var s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
function fromB64(b) { var s = atob(b), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function deriveKey(secret, salt, iter) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptText(secret, text) {
  var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  var key = await deriveKey(secret, salt, KDF_ITER);
  var ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(text)));
  return { n: KDF_ITER, s: toB64(salt), i: toB64(iv), c: toB64(ct) };
}
async function decryptBlob(secret, blob) {
  try {
    var key = await deriveKey(secret, fromB64(blob.s), blob.n);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(blob.i) }, key, fromB64(blob.c));
    return new TextDecoder().decode(pt);
  } catch (e) { return null; }
}

(function () {
  var blob = JSON.parse(document.getElementById('blob').textContent);
  var $ = function (id) { return document.getElementById(id); };
  $('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('btn').disabled = true; $('msg').textContent = 'Đang kiểm tra…';
    var secret = secretOf($('vy').value, $('nm').value, $('tb').value);
    var html = secret ? await decryptBlob(secret, blob) : null;
    if (!html) { $('msg').textContent = 'Chưa đúng rồi, bạn thử lại nhé.'; $('btn').disabled = false; return; }
    var diary = $('diary');
    diary.innerHTML = html;
    var hello = document.createElement('p');
    hello.className = 'hello';
    hello.textContent = 'Chào ' + $('who').value.trim() + ', cảm ơn bạn đã ghé qua.';
    var head = diary.querySelector('header');
    if (head) head.appendChild(hello);
    $('gate').hidden = true; diary.hidden = false; window.scrollTo(0, 0);
  });
})();
</script>
</body>
